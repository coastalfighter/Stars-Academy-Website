name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, lint, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright + axe)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the site and its CMS-enabled twin
        run: npm run e2e:build
      - name: Run Playwright
        run: npm run e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budgets
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub's Ubuntu runners ship Google Chrome; lighthouserc.cjs holds the budgets.
      - name: Run Lighthouse CI
        run: npm run lhci
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  studio:
    name: Sanity Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    env:
      # Schema validation and the build don't contact Sanity; any valid ID works.
      SANITY_STUDIO_PROJECT_ID: ci000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx sanity schema validate
      - run: npm run build
      # The Studio is a static editor app; Sanity's own tree carries moderate/high
      # advisories that only Sanity can resolve, so only critical ones block.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
